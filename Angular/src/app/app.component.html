<div class="demo-container">
  <dx-data-grid
    [dataSource]="customers"
    keyExpr="ID"
    [showBorders]="true"
    (onEditorPreparing)="onEditorPreparing($event)"
    (onOptionChanged)="onOptionChanged($event)"
  >
    <dxo-data-grid-filter-row [visible]="true"></dxo-data-grid-filter-row>
    <dxi-data-grid-column dataField="ID" [width]="80" [visible]="false"></dxi-data-grid-column>
    <dxi-data-grid-column dataField="CompanyName" caption="Company Name"></dxi-data-grid-column>
    <dxi-data-grid-column
      dataField="IsActive" 
      caption="Active" 
      dataType="boolean" 
      [filterValue]="true"
    ></dxi-data-grid-column>
    <dxi-data-grid-column
      dataField="CategoryId"
      caption="Category"
      [calculateDisplayValue]="calculateDisplayValue"
      [filterValue]="1"
    >
    </dxi-data-grid-column>
  </dx-data-grid>


  <ng-template #customFilterRowEditor let-options="options">
    <dx-drop-down-box
      [dataSource]="categories"  
      [(value)]="dropDownBoxValue"
      (onInitialized)="onInitialized($event, options.value)"
      valueExpr="id"
      displayExpr="name"
    >
      <dxi-drop-down-box-button  
        location= 'after'
        name= 'customClear'
        [options]="dropDownBoxButtonOptions">

      </dxi-drop-down-box-button>
      <div *dxTemplate="let data of 'content'">
        <dx-tree-list
          #treeViewComponent
          onContentReady="treeViewContentReady($event, options.value)"
          [selectedRowKeys]="treeListSelectedRowKeys"
          (onSelectionChanged)="treeListSelectionChanged($event, options.value)"
          [dataSource]="categories"
          keyExpr="id"
          parentIdExpr="parentId"
        >
          <dxo-tree-list-selection
            mode="single">
          </dxo-tree-list-selection>
          <dxi-tree-list-column dataField="name"></dxi-tree-list-column>
        </dx-tree-list>
      </div>
    </dx-drop-down-box>
  </ng-template>


</div>
